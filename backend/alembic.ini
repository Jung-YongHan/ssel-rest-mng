# Alembic configuration.
#
# NOTE: this file is intentionally ASCII-only. Alembic reads alembic.ini with the
# system locale codec (cp949 on Korean Windows), so non-ASCII comments break it.
#
# The DB URL is NOT set here on purpose. alembic/env.py injects
# app.core.config.settings.sqlalchemy_url (from .env) so that the app and the
# migrations always point at the same database.
#
# Usage:  cd backend && alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
