name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 백엔드 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 마이그레이션 적용 확인
        run: alembic upgrade head

      - name: 테스트
        run: pytest -q

  frontend:
    name: 프론트엔드 (타입체크 + 빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx vue-tsc --noEmit

      - name: 빌드
        run: npm run build

  docker:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드 (푸시 없음)
        run: docker build -t ssel-rest-mng:ci .
