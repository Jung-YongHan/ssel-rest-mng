# ==============================================================
#  연구실 선결제 관리 — 운영 배포용 compose
#
#      cp .env.example .env      # ← 먼저 .env 를 만들고 값을 채운다
#      docker compose up -d --build
#      docker compose logs -f app
#
#  프론트엔드는 백엔드 이미지 안에 함께 빌드되어 같은 포트로 서빙된다.
#  포트를 바꾸려면 .env 에 PORT=9000 처럼 적으면 된다.
# ==============================================================

name: ssel-rest-mng

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssel-rest-mng:latest
    container_name: ssel-rest-mng
    # 모든 설정은 .env 에서 주입한다 (시크릿을 compose 파일에 쓰지 말 것)
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      # 호스트 포트만 바뀐다. 컨테이너 내부는 항상 8000.
      - "${PORT:-8000}:8000"
    volumes:
      # SQLite DB(app.db) + 영수증 이미지(uploads/) 보존.
      # 이름 있는 볼륨이므로 `docker compose down` 이나 재빌드로 사라지지 않는다.
      # (완전히 지우려면 `docker compose down -v` — 되돌릴 수 없다)
      - app-data:/app/backend/data
    restart: unless-stopped

  # ── (선택) PostgreSQL 로 전환하기 ──────────────────────────
  #  연구실 규모에서는 SQLite 로 충분하다. 동시 쓰기가 늘거나 여러
  #  인스턴스를 띄울 때만 아래 주석을 풀고,
  #      .env 에  DATABASE_URL=postgresql+psycopg://ssel:CHANGE-ME@postgres:5432/ssel
  #  를 설정한 뒤 `docker compose up -d --build` 를 다시 실행한다.
  #  (backend/requirements.txt 에 psycopg[binary] 를 추가해야 한다)
  #
  # postgres:
  #   image: postgres:17-alpine
  #   container_name: ssel-postgres
  #   environment:
  #     POSTGRES_DB: ssel
  #     POSTGRES_USER: ssel
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
  #     TZ: ${TZ:-Asia/Seoul}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ssel -d ssel"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped
  #
  #  ↑ 를 켰다면 app 서비스에도 아래를 추가한다:
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  app-data:
  # pg-data:
