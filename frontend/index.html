<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- 브랜드 색: main.ts 의 primary / vite.config.ts 의 THEME_COLOR 와 동일하게 유지 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#234E9E" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1116" />
    <!-- 스크롤바·기본 폼 컨트롤이 다크 테마를 따라가게 한다 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="연구실 식당 선결제 잔액을 기록하고 관리합니다." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="선결제" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS 홈 화면 아이콘 규칙 (CLAUDE.md §3-12):
         · 알파 없는 풀블리드 정사각형 (iOS 가 알파를 검정으로 합성)
         · 그림 변경 시 -vN 으로 URL 을 올릴 것 — iOS 는 아이콘을 URL 단위로
           캐시해서 Safari 데이터를 지워도 예전 결과를 계속 쓴다
         · favicon.ico 는 BMP 엔트리 ICO 유지 (PNG-in-ICO 는 iOS 26 이 디코딩 실패).
           재생성: convert <src.png> -define icon:auto-resize=64,48,32,16 favicon.ico
         · /apple-touch-icon.png 은 링크 없이 찾아가는 관례 경로라 파일을 남겨둔다.
         진단 실험(HANDOFF §4-6): iOS 26/27 이 아이콘을 전부 200 으로 받고도 글자
         타일을 만들어서, 아이콘이 정상 동작하는 대조 사이트와 선언 모양을 동일하게
         맞췄다 — 단일 apple-touch-icon(sizes 없음) + manifest 아이콘 2개(any maskable),
         rel=icon 링크는 실험 동안 제거 (favicon.ico 는 관례 경로로 자동 탐색된다). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v5.png" />
    <title>연구실 선결제 관리</title>

    <!--
      번들·폰트를 받는 동안 흰 화면이 보이지 않도록 하는 인라인 스플래시.
      #app 안에 두었으므로 Vue 가 마운트되는 순간 통째로 교체된다.
      색은 main.ts 의 테마 토큰과 같은 값을 손으로 맞춘 것이다.
    -->
    <style>
      :root {
        --splash-bg: #f5f6f8;
        --splash-brand: #234e9e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #0e1116;
          --splash-brand: #8fb3f2;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
      }
      #app-splash .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--splash-brand);
        opacity: 0;
        animation: splash-in 0.9s ease-out 0.25s forwards;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .mark {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash" role="status" aria-label="불러오는 중">
        <div class="mark"></div>
      </div>
    </div>
    <noscript>이 앱을 사용하려면 자바스크립트를 켜주세요.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
