<!doctype html>
<!--
  보안 컨텍스트 진단 페이지 (일시적 — "보안 안 됨" 원인 규명 후 삭제할 것).
  서버 쪽 TLS 는 전 항목 정상인데(TLS1.3·SHA-256·SCT·체인 완전) 실기기
  Safari 가 "보안 안 됨"을 표시해서, 기기 자신의 판정을 화면에 띄운다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보안 진단</title>
    <style>
      body { margin: 0; padding: 24px 16px; font-family: -apple-system, system-ui, sans-serif;
             background: #f5f6f8; color: #1b2430; }
      h1 { font-size: 17px; margin: 0 0 16px; }
      h2 { font-size: 14px; margin: 26px 0 0; }
      button { margin-top: 4px; width: 100%; padding: 13px 16px; font-size: 15px;
               font-weight: 700; color: #fff; background: #234e9e; border: 0;
               border-radius: 12px; }
      .hint { font-size: 12px; line-height: 1.6; color: #5a6472; }
      dl { margin: 0; }
      dt { font-size: 12px; color: #5a6472; margin-top: 14px; }
      dd { margin: 2px 0 0; font-size: 16px; font-weight: 700; word-break: break-all; }
      .ok { color: #1b7f4b; } .bad { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>진단 — 이 화면을 캡처해 주세요</h1>
    <dl id="out"></dl>
    <h2>서버 연결 확인</h2>
    <dl id="probe"><dt>상태</dt><dd id="probe-status">확인 중...</dd></dl>
    <p>
      <button id="fix" type="button">서비스워커 해제 + 캐시 삭제 후 새로고침</button>
    </p>
    <p class="hint">
      로그인이 안 될 때: 위 버튼을 누르면 기기에 남은 옛 앱 파일을 비우고
      새로 받아옵니다. 홈 화면 앱에서 안 되면 Safari 로 이 주소를 열어 눌러도 됩니다.
    </p>
    <script>
      const rows = [
        ['주소 (protocol + host)', location.protocol + '//' + location.host],
        ['isSecureContext (핵심)', String(window.isSecureContext)],
        ['서비스워커 사용 가능', String('serviceWorker' in navigator)],
        ['서비스워커가 제어 중', String(!!(navigator.serviceWorker && navigator.serviceWorker.controller))],
        ['standalone (홈 화면 실행)', String(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true)],
        ['User-Agent', navigator.userAgent],
      ];
      document.getElementById('out').innerHTML = rows.map(([k, v]) => {
        let cls = '';
        if (k.startsWith('isSecureContext')) cls = v === 'true' ? 'ok' : 'bad';
        return '<dt>' + k + '</dt><dd class="' + cls + '">' + v + '</dd>';
      }).join('');
      // 서버에 실제로 닿는지 — 캐시·서비스워커를 우회해서 확인한다
      (async () => {
        const el = document.getElementById('probe-status');
        const started = Date.now();
        try {
          const res = await fetch('/api/health?probe=' + started, { cache: 'no-store' });
          const body = await res.text();
          el.className = res.ok ? 'ok' : 'bad';
          el.textContent = 'HTTP ' + res.status + ' (' + (Date.now() - started) + 'ms) ' + body.slice(0, 120);
        } catch (e) {
          el.className = 'bad';
          el.textContent = '요청 실패: ' + (e && e.message ? e.message : String(e));
        }
      })();

      // 옛 서비스워커·캐시가 사라진 청크를 붙잡고 있을 때의 복구 경로 (CLAUDE.md §3-11)
      document.getElementById('fix').addEventListener('click', async () => {
        const btn = document.getElementById('fix');
        btn.disabled = true;
        btn.textContent = '정리 중...';
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
        } catch (e) {
          /* 실패해도 새로고침은 시도한다 */
        }
        location.replace('/?fresh=' + Date.now());
      });
    </script>
  </body>
</html>
